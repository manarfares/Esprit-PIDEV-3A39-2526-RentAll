<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha visuel</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #202124;
        }
        .card {
            width: 420px;
            background: #fff;
            border: 1px solid #dadce0;
        }
        .head {
            background: #4a90e2;
            color: #fff;
            padding: 14px;
        }
        .head .l1 { font-size: 14px; opacity: 0.95; }
        .head .l2 { font-size: 32px; font-weight: 700; line-height: 1; margin-top: 2px; }
        .head .l3 { font-size: 13px; margin-top: 6px; opacity: 0.95; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: #fff;
            padding: 2px;
        }
        .tile {
            height: 92px;
            border: 1px solid #dfe1e5;
            cursor: pointer;
            font-size: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #dbeafe, #e5e7eb);
            user-select: none;
        }
        .tile.selected {
            outline: 4px solid #1a73e8;
            outline-offset: -4px;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            padding: 10px;
            gap: 8px;
            border-top: 1px solid #dadce0;
        }
        .btn {
            border: none;
            background: #1a73e8;
            color: #fff;
            font-weight: 700;
            padding: 10px 18px;
            cursor: pointer;
        }
        .btn.alt {
            background: #5f6368;
        }
        .status {
            padding: 0 12px 10px;
            font-size: 13px;
            font-weight: 700;
            color: #5f6368;
        }
        .status.ok { color: #188038; }
        .status.err { color: #d93025; }
        .google-wrap {
            padding: 8px 12px 14px;
            border-top: 1px solid #dadce0;
        }
        .google-note {
            font-size: 12px;
            color: #5f6368;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="head">
        <div class="l1">Select all images with</div>
        <div class="l2">cars</div>
        <div class="l3">Click verify once there are none left.</div>
    </div>

    <div id="grid" class="grid"></div>

    <div class="actions">
        <button id="resetBtn" class="btn alt" type="button">RESET</button>
        <button id="verifyBtn" class="btn" type="button">VERIFY</button>
    </div>
    <div id="status" class="status">Selectionnez les images avec voiture.</div>

    <div class="google-wrap">
        <div class="google-note">Verification Google obligatoire (securite serveur).</div>
        <div
            class="g-recaptcha"
            data-sitekey="__SITE_KEY__"
            data-callback="onCaptchaSuccess"
            data-expired-callback="onCaptchaExpired"
            data-error-callback="onCaptchaError">
        </div>
    </div>
</div>

<script>
    var _captchaToken = "";
    var _captchaReady = false;
    var _captchaError = "";
    var _captchaScore = 1.0;

    var _visualSolved = false;
    var _googleSolved = false;

    var tilesData = [
        { icon: "🚗", car: true },
        { icon: "🏠", car: false },
        { icon: "🚙", car: true },
        { icon: "🌳", car: false },
        { icon: "🚘", car: true },
        { icon: "🚦", car: false },
        { icon: "🛣️", car: false },
        { icon: "🚕", car: true },
        { icon: "🌉", car: false }
    ];

    function setStatus(text, css) {
        var el = document.getElementById("status");
        el.className = "status" + (css ? " " + css : "");
        el.textContent = text;
    }

    function renderGrid() {
        var grid = document.getElementById("grid");
        grid.innerHTML = "";
        tilesData.forEach(function(t, idx) {
            var d = document.createElement("div");
            d.className = "tile";
            d.textContent = t.icon;
            d.dataset.index = idx;
            d.dataset.selected = "false";
            d.onclick = function() {
                var selected = d.dataset.selected === "true";
                d.dataset.selected = selected ? "false" : "true";
                d.classList.toggle("selected", !selected);
            };
            grid.appendChild(d);
        });
    }

    function resetVisual() {
        _visualSolved = false;
        renderGrid();
        setStatus("Selectionnez les images avec voiture.");
        updateReadyState();
    }

    function verifyVisual() {
        var tiles = document.querySelectorAll(".tile");
        var ok = true;
        tiles.forEach(function(el) {
            var idx = parseInt(el.dataset.index, 10);
            var selected = el.dataset.selected === "true";
            if (selected !== tilesData[idx].car) ok = false;
        });
        _visualSolved = ok;
        if (ok) setStatus("Grille validee. Completez reCAPTCHA Google.", "ok");
        else setStatus("Mauvaise selection. Reessayez.", "err");
        updateReadyState();
    }

    function updateReadyState() {
        _captchaReady = _visualSolved && _googleSolved && !!_captchaToken;
    }

    function onCaptchaSuccess(token) {
        _captchaToken = token || "";
        _googleSolved = !!token;
        _captchaError = "";
        updateReadyState();
        if (_visualSolved && _googleSolved) setStatus("Verification complete.", "ok");
    }

    function onCaptchaExpired() {
        _captchaToken = "";
        _googleSolved = false;
        _captchaReady = false;
        setStatus("Token Google expire. Revalidez le reCAPTCHA.", "err");
    }

    function onCaptchaError() {
        _captchaToken = "";
        _googleSolved = false;
        _captchaReady = false;
        _captchaError = "Erreur reCAPTCHA";
        setStatus("Erreur Google reCAPTCHA.", "err");
    }

    function getCaptchaToken() { return _captchaToken; }
    function getCaptchaReady() { return _captchaReady; }
    function getCaptchaError() { return _captchaError; }
    function getCaptchaScore() { return _captchaScore; }
    function displayScore(score) { _captchaScore = score; }

    function refreshToken() {
        _captchaToken = "";
        _googleSolved = false;
        _captchaReady = false;
        _captchaError = "";
        _visualSolved = false;
        if (window.grecaptcha) {
            try { grecaptcha.reset(); } catch (e) {}
        }
        resetVisual();
    }

    document.getElementById("verifyBtn").addEventListener("click", verifyVisual);
    document.getElementById("resetBtn").addEventListener("click", resetVisual);
    renderGrid();
</script>
</body>
</html>
