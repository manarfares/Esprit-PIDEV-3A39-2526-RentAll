<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Listings Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet CSS -->
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""/>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  #map { width: 100%; height: 100vh; }

  .custom-popup .leaflet-popup-content-wrapper {
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    padding: 0;
    overflow: hidden;
  }
  .custom-popup .leaflet-popup-content {
    margin: 0;
    min-width: 200px;
  }
  .popup-header {
    background: linear-gradient(135deg, #6C63FF, #9B59B6);
    color: white;
    padding: 10px 14px 8px 14px;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .popup-type {
    font-size: 10px;
    opacity: 0.85;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .popup-name {
    font-size: 14px;
    font-weight: bold;
    margin-top: 2px;
  }
  .popup-body {
    padding: 10px 14px 12px 14px;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 12px;
    color: #2c3e50;
  }
  .popup-price {
    font-size: 14px;
    font-weight: bold;
    color: #6C63FF;
    margin-bottom: 4px;
  }
  .popup-location {
    color: #95a5a6;
    font-size: 11px;
  }
</style>
</head>
<body>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<script>
  // Default center: Tunisia
  var map = L.map('map').setView([33.8869, 9.5375], 6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18
  }).addTo(map);

  // Custom purple marker icon
  var purpleIcon = L.divIcon({
    className: '',
    html: '<div style="width:14px;height:14px;background:#6C63FF;border:2px solid white;' +
          'border-radius:50%;box-shadow:0 2px 6px rgba(108,99,255,0.5);"></div>',
    iconSize: [14, 14],
    iconAnchor: [7, 7],
    popupAnchor: [0, -10]
  });

  var markers = [];

  // Called from Java with JSON array of listings
  function loadListings(jsonStr) {
    // Force Leaflet to recalculate size first
    map.invalidateSize(true);

    // Clear existing markers
    markers.forEach(function(m) { map.removeLayer(m); });
    markers = [];

    var listings = JSON.parse(jsonStr);
    if (!listings || listings.length === 0) return;

    var bounds = [];

    listings.forEach(function(item) {
      if (item.lat == null || item.lng == null) return;

      var popup = '<div class="popup-header">' +
                  '<div class="popup-type">' + item.type + '</div>' +
                  '<div class="popup-name">' + escHtml(item.name) + '</div>' +
                  '</div>' +
                  '<div class="popup-body">' +
                  '<div class="popup-price">' + escHtml(item.price) + '</div>' +
                  '<div class="popup-location">📍 ' + escHtml(item.location) + '</div>' +
                  '</div>';

      var marker = L.marker([item.lat, item.lng], {icon: purpleIcon})
                    .bindPopup(popup, {className: 'custom-popup'})
                    .addTo(map);
      markers.push(marker);
      bounds.push([item.lat, item.lng]);
    });

    if (bounds.length > 0) {
      map.fitBounds(bounds, {padding: [40, 40], maxZoom: 13});
    }
  }

  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
